[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fivedreg"
version = "0.1.0"
description = "Five-dimensional regression with a Keras MLP and local web interface"
requires-python = ">=3.11,<3.14"
authors = [{name = "Peijing Pang"}]
dependencies = [
    "numpy>=2.4,<2.5",
    "scikit-learn>=1.9,<2",
    "tensorflow>=2.21,<2.22",
    "fastapi>=0.143,<0.144",
    "uvicorn>=0.34,<1",
    "pydantic>=2.14,<3",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["fivedreg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
